name: Build Axiom.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          # a failed build stops the job here (the .app folder can exist even when compiling failed)
          xcodebuild \
            -project Axiom.xcodeproj \
            -scheme Axiom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -100; tail -40 build.log; exit 1; }
          grep -E "warning: .*deprecated|BUILD SUCCEEDED" build.log || true
          test -f build/Build/Products/Release-iphoneos/Axiom.app/Axiom
          test -f build/Build/Products/Release-iphoneos/Axiom.app/PlugIns/AxiomWidgets.appex/AxiomWidgets

      - name: Add the app group so SideStore / AltStore set up the widgets' shared storage
        run: |
          APP=build/Build/Products/Release-iphoneos/Axiom.app
          ls "$APP/PlugIns"
          codesign --force --sign - --entitlements Widgets/AxiomWidgets.entitlements "$APP/PlugIns/AxiomWidgets.appex"
          codesign --force --sign - --entitlements App/Axiom.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package Axiom.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Axiom.app Payload/
          zip -qry Axiom.ipa Payload
          ls -la Axiom.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-ipa
          path: Axiom.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish as the "latest" release (download it on your iPhone from the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Axiom.ipa --title "Axiom for iPhone" \
            --notes "Built from ${GITHUB_SHA::7}. Download Axiom.ipa on your iPhone, then open it in SideStore or AltStore."
