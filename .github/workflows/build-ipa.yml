name: Build Axiom.ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          # a failed build stops the job here (the .app folder can exist even when compiling failed)
          xcodebuild \
            -project Axiom.xcodeproj \
            -scheme Axiom \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; tail -40 build.log; exit 1; }
          grep -E "warning: .*deprecated|BUILD SUCCEEDED" build.log || true
          test -f build/Build/Products/Release-iphoneos/Axiom.app/Axiom
          test -f build/Build/Products/Release-iphoneos/Axiom.app/PlugIns/AxiomWidgets.appex/AxiomWidgets

      - name: Add the app group so SideStore / AltStore set up the widgets' shared storage
        run: |
          APP=build/Build/Products/Release-iphoneos/Axiom.app
          ls "$APP/PlugIns"
          codesign --force --sign - --entitlements Widgets/AxiomWidgets.entitlements "$APP/PlugIns/AxiomWidgets.appex"
          codesign --force --sign - --entitlements App/Axiom.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package Axiom.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Axiom.app Payload/
          zip -qry Axiom.ipa Payload
          ls -la Axiom.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-ipa
          path: Axiom.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish as the "latest" release (download it on your iPhone from the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Axiom.ipa --title "Axiom for iPhone" \
            --notes "Built from ${GITHUB_SHA::7}. Download Axiom.ipa on your iPhone, then open it in SideStore or AltStore."

      - name: On a failed build, publish the log as the "build-log" release so it can be read without the Actions log viewer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f build.log || echo "no build log" > build.log
          grep -E "error:|warning: unreachable" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > build-errors.txt || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log build-errors.txt --prerelease --title "Last failed build log" --notes "Errors from ${GITHUB_SHA::7}."

  previews:
    # draws every widget at every size from real dashboard data and checks the data and storage logic
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test and draw the widgets
        run: |
          SIM=$(xcrun simctl list devices available | grep -E "^\s+iPhone 1[5-7]" | head -1 | sed -E 's/^ +(.*) \(([0-9A-F-]+)\).*/\2/')
          echo "Simulator: $SIM"
          mkdir -p previews
          TEST_RUNNER_PREVIEW_DIR="$PWD/previews" xcodebuild test \
            -project Axiom.xcodeproj -scheme AxiomTests \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO > test.log 2>&1 || { grep -E "error:|failed|XCTAssert" test.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; FAILED=1; }
          grep -E "Test Case .* (passed|failed)|Executed" test.log | tail -12 || true
          ls previews | head -100
          test -z "$FAILED"
      - name: Publish the pictures and test log as the "widget-previews" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f test.log || echo "no test log" > test.log
          grep -E "error:|Test Case|Executed|XCTAssert" test.log | sed "s#$GITHUB_WORKSPACE/##" > test-summary.txt || true
          (cd previews 2>/dev/null && zip -qr ../widget-previews.zip .) || echo "no pictures" > widget-previews.zip
          gh release delete widget-previews --yes --cleanup-tag || true
          gh release create widget-previews widget-previews.zip test-summary.txt --prerelease --title "Widget previews" --notes "Every widget drawn from real dashboard data, ${GITHUB_SHA::7}."
